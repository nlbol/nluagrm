name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build
        run: |
          test -d dist
          test -f dist/index.html

      - name: Create .nojekyll
        run: |
          touch dist/.nojekyll

      - name: Create CNAME
        run: |
          echo "nluagrm.org" > dist/CNAME

      - name: Verify generated site
        run: |
          echo "===== DIST ====="
          find dist -maxdepth 2 -type f | sort
          echo
          echo "===== CNAME ====="
          cat dist/CNAME

      - name: Deploy to public
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: public
          folder: dist
          clean: true
          clean-exclude: |
            .git
          single-commit: true
